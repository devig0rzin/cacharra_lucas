# Backup diário do banco (o plano gratuito do Supabase não faz backup).
# O arquivo é criptografado e guardado como artefato do GitHub por 30 dias.
#
# Secrets necessários:
#   DATABASE_URL       conexão DIRETA (porta 5432) ou "Session pooler" do Supabase
#   BACKUP_PASSPHRASE  senha para criptografar o backup (guarde com o cliente!)
#
# Restaurar:  gpg -d backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"
name: Backup do banco

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em Brasília
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar dump criptografado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL não configurado; pulando."; exit 0; fi
          docker run --rm postgres:17 pg_dump --no-owner --no-privileges --schema=public "$DATABASE_URL" \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            -o backup.sql.gz.gpg
          ls -lh backup.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        if: hashFiles('backup.sql.gz.gpg') != ''
        with:
          name: backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
